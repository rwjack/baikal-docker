# Scheduled package rebuilds for the latest Baikal release.
# Version releases are handled by build-release.yaml only.
name: Rebuild images

on:
  # Rebuild on the 1st and 15th of each month at 08:20 UTC
  schedule:
    - cron: "20 8 1,15 * *"

  # Allow manually triggered rebuilds
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  parse_release_tag:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.parse-release-tag.outputs.REF_NAME }}
      baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}
      rebuild-date: ${{ steps.parse-release-tag.outputs.REBUILD_DATE }}
    steps:
      - name: Parse release tag
        id: parse-release-tag
        run: |
          REF_NAME=$(curl -fsS "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          if [ -z "$REF_NAME" ] || [ "$REF_NAME" = "null" ]; then
            echo "::error::Could not determine latest release tag"
            exit 1
          fi

          BAIKAL_VERSION=${REF_NAME/+*/}
          REBUILD_DATE=$(date -u +%Y%m%d)
          echo "Parsed Baikal version $BAIKAL_VERSION from release $REF_NAME (rebuild $REBUILD_DATE)"
          echo "REF_NAME=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "BAIKAL_VERSION=$BAIKAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "REBUILD_DATE=$REBUILD_DATE" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.dockerfile }}
    needs: parse_release_tag
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      ref: ${{ needs.parse_release_tag.outputs.ref }}
    strategy:
      fail-fast: true
      matrix:
        dockerfile:
          - nginx

  nginx:
    name: Nginx
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      tags: |
        ghcr.io/${{ github.repository_owner }}/baikal:latest
        ghcr.io/${{ github.repository_owner }}/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}
        ghcr.io/${{ github.repository_owner }}/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-${{ needs.parse_release_tag.outputs.rebuild-date }}
    secrets: inherit
